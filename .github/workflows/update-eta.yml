name: Update Bus ETA

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-eta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate eta.json
        run: node update-eta.js

      - name: Show generated file
        run: |
          echo "Generated eta.json:"
          cat eta.json

      - name: Commit updated eta.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eta.json
          git diff --cached --quiet || git commit -m "Update bus ETA"
          git push
